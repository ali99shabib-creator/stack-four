name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f privacy.html ]; then cp privacy.html www/privacy.html; fi

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/stack-four-release.jks

      - name: Build unsigned release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="android/app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/app-release.apk"

          test -f "$UNSIGNED_APK"

          "$ZIPALIGN" -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          "$APKSIGNER" sign             --ks android/app/stack-four-release.jks             --ks-key-alias "$KEY_ALIAS"             --ks-pass "pass:$STORE_PASSWORD"             --key-pass "pass:$STORE_PASSWORD"             --out "$SIGNED_APK"             "$ALIGNED_APK"

          "$APKSIGNER" verify --verbose "$SIGNED_APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: StackFour-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk
